  function attachClickHandler() {
    var plotDiv = document.querySelector('.plotly-graph-div');
    if (!plotDiv) {
      setTimeout(attachClickHandler, 100);
      return;
    }
    plotDiv.on('plotly_click', function(data) {
      var point = data.points[0];
      if (point && point.customdata) {
        window.open(point.customdata, '_blank');
      }
    });
    plotDiv.style.cursor = 'pointer';
  }

  function setDragMode() {
  var plotDiv = document.querySelector('.plotly-graph-div');
  if (!plotDiv) {
    setTimeout(setDragMode, 100);
    return;
  }
  var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouchDevice) {
    Plotly.relayout(plotDiv, { dragmode: 'pan' });  // single finger pans
    enablePinchZoom(plotDiv);                        // two fingers zoom
  } else {
    Plotly.relayout(plotDiv, { dragmode: 'pan' });
  }
}

function enablePinchZoom(plotDiv) {
  var initialDistance = null;
  var initialXRange = null;
  var initialYRange = null;

  plotDiv.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      initialDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      var layout = plotDiv._fullLayout;
      initialXRange = [layout.xaxis.range[0], layout.xaxis.range[1]];
      initialYRange = [layout.yaxis.range[0], layout.yaxis.range[1]];
    }
  }, { passive: true });

  plotDiv.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && initialDistance && initialXRange && initialYRange) {
      var currentDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      var scale = initialDistance / currentDistance;

      var xCenter = (initialXRange[0] + initialXRange[1]) / 2;
      var yCenter = (initialYRange[0] + initialYRange[1]) / 2;
      var xHalfSpan = (initialXRange[1] - initialXRange[0]) / 2 * scale;
      var yHalfSpan = (initialYRange[1] - initialYRange[0]) / 2 * scale;

      Plotly.relayout(plotDiv, {
        'xaxis.range': [xCenter - xHalfSpan, xCenter + xHalfSpan],
        'yaxis.range': [yCenter - yHalfSpan, yCenter + yHalfSpan],
      });
    }
  }, { passive: true });

  plotDiv.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) {
      initialDistance = null;
      initialXRange = null;
      initialYRange = null;
    }
  }, { passive: true });
  }
